    <script>
      // ABSOLUTE PERMANENT FIX: Kill any Vite WebSocket/HMR noise instantly
      (function() {
        const silenceStrings = ['[vite]', 'WebSocket', 'Firestore is currently offline', 'hmr-error', 'vite-hmr', 'WebSocket closed without opened'];
        const isBenign = (args) => {
          try {
            const str = JSON.stringify(args).toLowerCase();
            return silenceStrings.some(s => str.includes(s.toLowerCase()));
          } catch (e) { return false; }
        };
        
        // 1. Kill the WebSocket constructor for Vite patterns
        const OriginalWS = window.WebSocket;
        window.WebSocket = function(url, protocols) {
          if (typeof url === 'string' && (url.includes('ais-') || url.includes('localhost') || url.includes('/vite') || url.includes('ws://') || url.includes('wss://'))) {
            return {
              send: () => {}, close: () => {}, addEventListener: () => {}, removeEventListener: () => {},
              readyState: 3, onopen: null, onclose: null, onerror: null, onmessage: null
            };
          }
          try { return new OriginalWS(url, protocols); } catch (e) { return {}; }
        };
        window.WebSocket.prototype = OriginalWS.prototype;

        // 2. Wrap all console methods to filter benign noise
        ['error', 'warn', 'log', 'info', 'debug'].forEach(method => {
          const original = console[method];
          console[method] = function(...args) {
            if (isBenign(args)) return;
            original.apply(console, args);
          };
        });

        // 3. Catch all global errors and unhandled rejections
        const killEvent = (e) => {
          const msg = (e.message || (e.reason && e.reason.message) || "").toString();
          const reasonStr = (e.reason ? e.reason.toString() : "");
          if (silenceStrings.some(s => msg.includes(s) || reasonStr.includes(s))) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        };
        window.addEventListener('unhandledrejection', killEvent, true);
        window.addEventListener('error', killEvent, true);
      })();
    </script>
